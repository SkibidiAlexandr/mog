<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LOOKSMAX RPG</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:#0d0d12; color:#e8e8f0; min-height:100vh;
    padding:16px; max-width:480px; margin:0 auto;
  }
  h1 { font-size:22px; text-align:center; margin-bottom:4px;
       background:linear-gradient(90deg,#ff5c8a,#a06bff);
       -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { text-align:center; color:#888; font-size:12px; margin-bottom:14px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .stat { background:#1a1a24; border-radius:12px; padding:10px 12px; }
  .stat .label { font-size:11px; color:#9a9ab0; }
  .stat .value { font-size:20px; font-weight:700; }
  .bar { height:6px; background:#2a2a3a; border-radius:3px; margin-top:6px; overflow:hidden; }
  .bar > div { height:100%; border-radius:3px; transition:width .4s; }
  .money { color:#ffd166; } .looks { color:#ff5c8a; } .iq { color:#6bd6ff; } .status { color:#a06bff; }
  .energy { display:flex; align-items:center; gap:8px; margin-bottom:14px;
            background:#1a1a24; border-radius:12px; padding:8px 12px; }
  .energy .bar { flex:1; margin:0; height:10px; }
  .section { margin-bottom:16px; }
  .section h2 { font-size:14px; color:#9a9ab0; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card {
    background:#1a1a24; border:1px solid #2a2a3a; border-radius:14px;
    padding:12px; cursor:pointer; transition:transform .1s, border-color .2s;
  }
  .card:active { transform:scale(.96); }
  .card.locked { opacity:.45; }
  .card .icon { font-size:24px; }
  .card .name { font-size:13px; font-weight:600; margin:6px 0 2px; }
  .card .desc { font-size:11px; color:#9a9ab0; line-height:1.35; }
  .card .cost { font-size:11px; color:#ffd166; margin-top:6px; }
  .log { background:#14141c; border-radius:12px; padding:10px; font-size:12px;
         color:#b8b8cc; height:110px; overflow-y:auto; line-height:1.5; }
  .log p { margin-bottom:4px; }
  .log .bad { color:#ff7b7b; } .log .good { color:#7dffa8; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tab { flex:1; padding:9px 0; text-align:center; border-radius:10px; background:#1a1a24;
         font-size:12px; color:#9a9ab0; cursor:pointer; border:1px solid transparent; }
  .tab.active { border-color:#a06bff; color:#fff; }
  .hidden { display:none; }
  .btn-big {
    width:100%; padding:14px; border:none; border-radius:14px; font-size:15px; font-weight:700;
    background:linear-gradient(90deg,#ff5c8a,#a06bff); color:#fff; cursor:pointer; margin-top:6px;
  }
</style>
</head>
<body>
<h1>LOOKSMAX RPG</h1>
<div class="sub">Саб-3 → Гигачад. Не откисай.</div>

<div class="stats">
  <div class="stat"><div class="label">💰 Деньги</div><div class="value money" id="money">0</div></div>
  <div class="stat"><div class="label">🔥 Лукс</div><div class="value looks" id="looks">3.0</div><div class="bar"><div id="looksBar" style="width:30%;background:#ff5c8a"></div></div></div>
  <div class="stat"><div class="label">🧠 Интеллект</div><div class="value iq" id="iq">70</div><div class="bar"><div id="iqBar" style="width:70%;background:#6bd6ff"></div></div></div>
  <div class="stat"><div class="label">👑 Статус</div><div class="value status" id="status">0</div></div>
</div>
<div class="energy">⚡<div class="bar"><div id="energyBar" style="width:100%;background:#7dffa8"></div></div><span id="energyTxt" style="font-size:12px">100/100</span></div>

<div class="tabs">
  <div class="tab active" data-tab="train">Прокачка</div>
  <div class="tab" data-tab="career">Бизнес</div>
  <div class="tab" data-tab="life">Жизнь</div>
</div>

<div id="train" class="section">
  <div class="grid" id="trainGrid"></div>
</div>

<div id="career" class="section hidden">
  <div class="grid" id="bizGrid"></div>
</div>

<div id="life" class="section hidden">
  <div class="grid" id="lifeGrid"></div>
  <button class="btn-big" id="shootShot">mog</button>
  <div id="relInfo" style="margin-top:10px;font-size:13px;text-align:center;color:#b8b8cc"></div>
</div>

<div class="section">
  <h2>📋 Лог</h2>
  <div class="log" id="log"></div>
</div>

<script>
// ---------- Telegram ----------
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0d0d12'); }
const playerName = tg?.initDataUnsafe?.user?.first_name || 'Ты';

// ---------- Состояние ----------
const DEFAULTS = { money: 500, looks: 3.0, iq: 70, status: 0, energy: 100, biz: [], rel: null, log: [] };
let S = load();
function load() {
  try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('looksmax_save'))); }
  catch(e) { return {...DEFAULTS}; }
}
function save() { localStorage.setItem('looksmax_save', JSON.stringify(S)); }

// ---------- Данные действий ----------
const TRAIN = [
  { id:'gym',   icon:'🏋️', name:'Зал',        desc:'+0.2 лукс, +сила. Дрип не дрип, а качок — важно.', cost:100, energy:20, fx:s=>{s.looks+=0.2; s.status+=1;} },
  { id:'face',  icon:'🧴', name:'Уход за лицом', desc:'+0.15 лукс. Скинкеар-рутина, санскрин каждый день.', cost:150, energy:10, fx:s=>{s.looks+=0.15;} },
  { id:'hair',  icon:'💇', name:'Причёска',    desc:'+0.3 лукс. Фейд + текстура, только так.', cost:300, energy:5,  fx:s=>{s.looks+=0.3;} },
  { id:'style', icon:'👕', name:'Одежда',      desc:'+0.4 лукс. Подобранный вайб, а не просто дорого.', cost:800, energy:5,  fx:s=>{s.looks+=0.4;} },
  { id:'books', icon:'📚', name:'Читать',      desc:'+3 IQ. Книги по переговорам и биохакингу.', cost:50,  energy:15, fx:s=>{s.iq+=3;} },
  { id:'course',icon:'🎓', name:'Курсы',       desc:'+8 IQ. Платное обучение, нетворкинг.', cost:1000, energy:25, fx:s=>{s.iq+=8; s.status+=2;} },
  { id:'jaw',   icon:'🏥', name:'Операция (эстет.)', desc:'+1.0 лукс. Ментoplasty/рино. Больно, но того стоит.', cost:10000, energy:60, fx:s=>{s.looks+=1.0; s.status+=3;} },
  { id:'sleep', icon:'😴', name:'Восстановиться', desc:'+60 энергии. Сон — главный but способ луксмаксить.', cost:0, energy:-60, fx:s=>{} },
];
const BIZ = [
  { id:'dropship', icon:'📦', name:'Дропшиппинг',   cost:2000,  income:80 },
  { id:'salon',    icon:'💈', name:'Барбершоп',     cost:8000,  income:350 },
  { id:'gymbiz',   icon:'🏢', name:'Сеть залов',    cost:30000, income:1500 },
  { id:'brand',    icon:'🚀', name:'Свой бренд',    cost:100000,income:6000 },
];
const LIFE = [
  { id:'flat', icon:'🏠', name:'Квартира в центре', desc:'+25 статуса', cost:50000, fx:s=>{s.status+=25;} },
  { id:'car',  icon:'🚗', name:'Бэха/Мэрс', desc:'+15 статуса', cost:40000, fx:s=>{s.status+=15;} },
  { id:'watch',icon:'⌚', name:'Часы', desc:'+5 статуса', cost:15000, fx:s=>{s.status+=5;} },
  { id:'charity',icon:'🎗️', name:'Благотворительность', desc:'+4 статуса, +карма', cost:5000, fx:s=>{s.status+=4;} },
];

// ---------- Лог ----------
function logMsg(msg, cls='') {
  S.log.unshift({msg, cls, t: Date.now()});
  S.log = S.log.slice(0, 30);
  renderLog(); save();
}
function renderLog() {
  document.getElementById('log').innerHTML = S.log
    .map(l => `<p class="${l.cls}">${l.msg}</p>`).join('');
}

// ---------- Рендер ----------
function fmt(n){ return n>=1e6 ? (n/1e6).toFixed(1)+'M' : n.toLocaleString('ru-RU'); }
function renderStats() {
  document.getElementById('money').textContent = fmt(S.money);
  document.getElementById('looks').textContent = S.looks.toFixed(1);
  document.getElementById('iq').textContent = Math.round(S.iq);
  document.getElementById('status').textContent = Math.round(S.status);
  document.getElementById('looksBar').style.width = Math.min(100, S.looks*10) + '%';
  document.getElementById('iqBar').style.width = Math.min(100, S.iq) + '%';
  const e = Math.max(0, Math.min(100, S.energy));
  document.getElementById('energyBar').style.width = e + '%';
  document.getElementById('energyTxt').textContent = `${Math.round(e)}/100`;
}

function renderCards(list, containerId, ownedIds) {
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  list.forEach(item => {
    const owned = ownedIds?.includes(item.id);
    const div = document.createElement('div');
    div.className = 'card' + (owned ? ' locked' : '');
    const costTxt = item.income ? `💰 ${fmt(item.cost)} | +${fmt(item.income)}/тик` : (item.cost ? `💰 ${fmt(item.cost)} | ⚡${item.energy}` : '⚡+60');
    div.innerHTML = `<div class="icon">${item.icon}</div><div class="name">${item.name}</div><div class="desc">${item.desc}</div><div class="cost">${owned ? '✅ Куплено' : costTxt}</div>`;
    if (!owned) div.onclick = () => doAction(item);
    c.appendChild(div);
  });
}

function renderAll() {
  renderStats();
  renderCards(TRAIN, 'trainGrid');
  renderCards(BIZ, 'bizGrid', S.biz);
  renderCards(LIFE, 'lifeGrid');
  renderRel();
  renderLog();
}

// ---------- Действия ----------
function doAction(item) {
  if (S.energy < Math.max(0,item.energy)) { logMsg('😮‍💨 Нет энергии. Поспи.', 'bad'); return; }
  if (S.money < item.cost) { logMsg('💸 Не хватает денег на «' + item.name + '»', 'bad'); return; }
  S.money -= item.cost;
  S.energy -= Math.max(0, item.energy);
  if (item.income) { S.biz.push(item.id); logMsg(`✅ Открыл бизнес: ${item.name}!`, 'good'); }
  else if (item.fx) { item.fx(S); logMsg(`${item.icon} ${item.name}: сделано.`, 'good'); }
  if (item.income) S.status += 2;
  renderAll(); save();
}

// ---------- Отношения ----------
function renderRel() {
  const el = document.getElementById('relInfo');
  if (S.rel) { el.innerHTML = `❤️ Встречаешься с <b>${S.rel.name}</b> (${S.rel.looks} лукс)`; return; }
  el.textContent = 'Свободен. Найди кого-то через «Замогать».';
}
function shootShot() {
  const names = ['Алина','Мия','Соня','Кира','Вера','Ника','Ляйсан'];
  const crushLooks = +(2 + Math.random()*7).toFixed(1);
  const name = names[Math.floor(Math.random()*names.length)];
  const myScore = S.looks*1.5 + S.status*0.2 + S.iq*0.05;
  const herBar = crushLooks*1.8;
  if (myScore >= herBar) {
    S.rel = { name, looks: crushLooks };
    logMsg(`❤️ ${name} сказала ДА! Она на ${crushLooks} лукс.`, 'good');
  } else {
    logMsg(`💔 ${name} (${crushLooks} лукс): «Прости, но нет... ты слишком саб»`, 'bad');
  }
  renderAll(); save();
}
document.getElementById('shootShot').onclick = shootShot;

// ---------- Топ ----------
// ---------- Тики: энергия + доход ----------
setInterval(() => {
  S.energy = Math.min(100, S.energy + 3);
  const income = BIZ.filter(b => S.biz.includes(b.id)).reduce((a,b) => a+b.income, 0);
  if (income) S.money += income;
  renderStats(); save();
}, 5000);

// ---------- Табы ----------
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
    document.getElementById(t.dataset.tab).classList.remove('hidden');
  };
});

renderAll();
if (!S.log.length) logMsg(`👋 Привет, ${playerName}! Ты саб-3. Пора луксмаксить.`, 'good');
</script>
</body>
</html>
