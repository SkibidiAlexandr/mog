<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mog Life</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:#0d0d12; color:#e8e8f0; min-height:100vh;
    padding:16px 16px 90px; max-width:480px; margin:0 auto;
  }
  /* ---- Top bar ---- */
  .topbar {
    position:sticky; top:0; z-index:90; margin:-16px -16px 14px; padding:10px 16px;
    background:#0d0d12ee; backdrop-filter:blur(10px); border-bottom:1px solid #1f1f2c;
    display:flex; align-items:center; gap:12px;
  }
  .tb-ava { width:48px; height:48px; border-radius:15px; overflow:hidden; flex-shrink:0;
            cursor:pointer; border:2px solid #3a3a4a; background:#2a2a3a; }
  .tb-ava svg { display:block; }
  .tb-info { flex:1; min-width:0; }
  .tb-name { font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tb-status { display:flex; align-items:center; gap:6px; margin-top:3px; font-size:11px; flex-wrap:wrap; }
  .tb-tier { padding:2px 8px; border-radius:10px; font-weight:700; }
  .tb-res { text-align:right; font-size:12px; font-weight:700; line-height:1.5; flex-shrink:0; }
  .money { color:#ffd166; } .looks { color:#ff5c8a; } .iq { color:#6bd6ff; }
  .status { color:#a06bff; } .aura { color:#7dffa8; }
  .hidden { display:none; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card {
    background:#1a1a24; border:1px solid #2a2a3a; border-radius:14px;
    padding:12px; cursor:pointer; transition:transform .1s, border-color .2s;
  }
  .card:active { transform:scale(.96); }
  .card.locked { opacity:.45; }
  .card .icon { font-size:24px; }
  .card .name { font-size:13px; font-weight:600; margin:6px 0 2px; }
  .card .desc { font-size:11px; color:#9a9ab0; line-height:1.35; }
  .card .eff { font-size:11px; color:#7dffa8; margin-top:6px; line-height:1.35; }
  .card .cost { font-size:11px; color:#ffd166; margin-top:6px; }
  .btn-big {
    width:100%; padding:14px; border:none; border-radius:14px; font-size:15px; font-weight:700;
    background:linear-gradient(90deg,#ff5c8a,#a06bff); color:#fff; cursor:pointer; margin-top:6px;
  }
  .btn-ghost {
    width:100%; padding:11px; border:1px solid #3a3a4a; border-radius:14px; font-size:13px;
    background:#1a1a24; color:#b8b8cc; cursor:pointer; margin-top:8px;
  }
  .section h2 { font-size:14px; color:#9a9ab0; margin:4px 0 10px; text-transform:uppercase; letter-spacing:1px; }

  /* ---- Profile ---- */
  .profile-top { display:flex; gap:14px; align-items:center; margin-bottom:16px; }
  .avatar-wrap { position:relative; width:96px; height:96px; flex-shrink:0; }
  .avatar-ring { position:absolute; inset:-5px; border-radius:32px; }
  .p-name { font-size:19px; font-weight:800; }
  .p-tier { display:inline-block; margin-top:6px; padding:4px 12px; border-radius:20px;
            font-size:12px; font-weight:700; }
  .p-tier-sub { font-size:11px; color:#9a9ab0; margin-top:6px; line-height:1.4; }
  .stats-list { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .srow { display:flex; align-items:center; gap:10px; background:#1a1a24;
          border-radius:12px; padding:10px 14px; }
  .srow .sl { font-size:12px; color:#9a9ab0; width:120px; }
  .srow .sv { font-size:16px; font-weight:700; flex:1; }
  .srow .bar { flex:2; height:8px; background:#2a2a3a; border-radius:4px; overflow:hidden; }
  .srow .bar > div { height:100%; border-radius:4px; transition:width .4s; }
  .daily {
    background:linear-gradient(135deg,#241a2e,#1a1a24); border:1px solid #3a2a4a;
    border-radius:16px; padding:14px; text-align:center;
  }
  .daily .d-title { font-size:14px; font-weight:700; margin-bottom:4px; }
  .daily .d-desc { font-size:11px; color:#9a9ab0; margin-bottom:10px; }

  /* ---- Profile overlay ---- */
  .overlay { position:fixed; inset:0; z-index:150; background:#0d0d12; overflow-y:auto; padding:16px 16px 40px; }
  .overlay-in { max-width:480px; margin:0 auto; }
  .back-btn { background:none; border:none; color:#b8b8cc; font-size:14px; padding:4px 0 14px; cursor:pointer; }

  /* ---- Relations (dating) ---- */
  .relbar { display:flex; align-items:center; gap:12px; background:#1a1a24; border:1px solid #2a2a3a;
            border-radius:16px; padding:10px 12px; margin-bottom:12px; }
  .rb-ava { width:52px; height:52px; border-radius:16px; overflow:hidden; background:#2a2a3a; flex-shrink:0; }
  .rb-ava svg, .m-ava svg { display:block; }
  .rb-txt { flex:1; min-width:0; }
  .rb-t { font-size:11px; color:#9a9ab0; }
  .rb-n { font-size:15px; font-weight:700; }
  .rb-s { font-size:12px; color:#b8b8cc; margin-top:2px; }
  .rb-btn { border:1px solid #3a3a4a; background:#14141c; color:#ff7b7b; border-radius:12px;
            padding:8px 12px; font-size:13px; cursor:pointer; }
  .reltabs { display:flex; gap:8px; margin-bottom:12px; }
  .rtab { flex:1; padding:9px; border-radius:12px; border:1px solid #2a2a3a; background:#1a1a24;
          color:#9a9ab0; font-size:13px; font-weight:600; cursor:pointer; }
  .rtab.active { color:#fff; border-color:#a06bff; background:#241a2e; }
  .swipe-area { position:relative; height:400px; margin-bottom:14px; }
  .gcard { position:absolute; inset:0; border-radius:22px; overflow:hidden; background:#1a1a24;
           border:1px solid #2a2a3a; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
  .gcard.top { cursor:grab; }
  .gcard.behind { transform:scale(.95) translateY(12px); opacity:.65; }
  .gpic { position:absolute; inset:0; pointer-events:none; }
  .gpic svg { display:block; width:100%; height:100%; }
  .ginfo { position:absolute; left:0; right:0; bottom:0; padding:48px 14px 14px;
           background:linear-gradient(transparent,#000d 55%); pointer-events:none; }
  .gname { font-size:20px; font-weight:800; }
  .gchips { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .chip { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; background:#ffffff1f; }
  .chip.st { background:#a06bff44; color:#e3d2ff; }
  .chip.lk { color:#ff8fb0; }
  .gbio { font-size:12px; color:#d0d0e0; margin-top:8px; line-height:1.4; }
  .stamp { position:absolute; top:22px; padding:3px 12px; border:3px solid; border-radius:10px;
           font-weight:900; font-size:22px; opacity:0; pointer-events:none; }
  .stamp.like { left:18px; color:#7dffa8; transform:rotate(-12deg); }
  .stamp.nope { right:18px; color:#ff5c6a; transform:rotate(12deg); }
  .swipe-btns { display:flex; justify-content:center; gap:30px; }
  .rbtn { width:66px; height:66px; border-radius:50%; border:2px solid; background:#1a1a24;
          font-size:26px; cursor:pointer; }
  .rbtn.nope { border-color:#ff5c6a; } .rbtn.like { border-color:#7dffa8; }
  .rbtn:active { transform:scale(.92); }
  .swipe-hint { text-align:center; font-size:11px; color:#9a9ab0; margin-top:10px; }
  .match { display:flex; gap:12px; align-items:center; background:#1a1a24; border:1px solid #2a2a3a;
           border-radius:16px; padding:10px; margin-bottom:10px; }
  .m-ava { width:64px; height:64px; border-radius:18px; overflow:hidden; flex-shrink:0; background:#2a2a3a; }
  .m-body { flex:1; min-width:0; }
  .m-name { font-size:15px; font-weight:700; }
  .m-btns { display:flex; gap:6px; margin-top:8px; }
  .m-btns button { border:none; border-radius:10px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer; }
  .m-go { background:linear-gradient(90deg,#ff5c8a,#a06bff); color:#fff; }
  .m-del { background:#2a2a3a; color:#b8b8cc; }
  .empty-note { text-align:center; color:#9a9ab0; font-size:13px; padding:30px 10px; line-height:1.5; }

  /* ---- Battle ---- */
  .opp {
    background:#1a1a24; border:1px solid #2a2a3a; border-radius:16px;
    padding:14px; margin-bottom:10px;
  }
  .opp-head { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .opp-ava { width:52px; height:52px; border-radius:16px; display:flex; align-items:center;
             justify-content:center; font-size:26px; background:#2a2a3a; flex-shrink:0; }
  .opp-name { font-size:15px; font-weight:700; }
  .opp-tier { font-size:11px; color:#9a9ab0; }
  .opp-stats { display:flex; gap:14px; font-size:12px; color:#b8b8cc; margin-bottom:10px; }
  .opp .btn-battle {
    width:100%; padding:10px; border:none; border-radius:10px; font-weight:700; font-size:13px;
    background:linear-gradient(90deg,#ff5c8a,#ff8a5c); color:#fff; cursor:pointer;
  }
  .timer-note { text-align:center; font-size:11px; color:#9a9ab0; margin-top:4px; }

  /* ---- Toast ---- */
  .toast {
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-80px);
    background:#24243a; border:1px solid #3a3a5a; padding:10px 18px; border-radius:14px;
    font-size:13px; z-index:200; transition:transform .3s; max-width:90%; text-align:center;
    box-shadow:0 8px 30px #000a;
  }
  .toast.show { transform:translateX(-50%) translateY(0); }

  /* ---- Bottom nav ---- */
  .bottomnav {
    position:fixed; bottom:0; left:0; right:0; z-index:100;
    background:#14141ccc; backdrop-filter:blur(12px);
    border-top:1px solid #2a2a3a;
    display:flex; padding:4px 2px calc(4px + env(safe-area-inset-bottom));
  }
  .navitem {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:1px;
    padding:5px 0; border-radius:10px; cursor:pointer; color:#9a9ab0;
    font-size:9px; border:none; background:none;
  }
  .navitem .ic { font-size:19px; }
  .navitem.active { color:#fff; }
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-ava" id="tbAva" title="Профиль"></div>
  <div class="tb-info">
    <div class="tb-name" id="tbName">Ты</div>
    <div class="tb-status"><span class="tb-tier" id="tbTier"></span><span class="status" id="tbStatus">👑 0</span></div>
  </div>
  <div class="tb-res"><div class="money" id="tbMoney">0</div><div class="aura" id="tbEnergy">⚡ 100</div></div>
</header>

<!-- ПРОКАЧКА -->
<div id="train" class="section">
  <div class="grid" id="trainGrid"></div>
</div>

<!-- ЗАРАБОТОК -->
<div id="biz" class="section hidden">
  <h2>Пассивный доход</h2>
  <div class="grid" id="bizGrid"></div>
  <h2 style="margin-top:16px">Активный заработок</h2>
  <div class="grid" id="grindGrid"></div>
</div>

<!-- MOG БАТЛЫ -->
<div id="battle" class="section hidden">
  <h2>⚔️ Mog Battle</h2>
  <div id="oppList"></div>
  <button class="btn-ghost" id="rerollBtn">🔄 Заменить луксмаксеров</button>
  <div class="timer-note" id="timerNote"></div>
</div>

<!-- НЕДВИЖИМОСТЬ -->
<div id="estate" class="section hidden">
  <div class="grid" id="estateGrid"></div>
</div>

<!-- ОТНОШЕНИЯ -->
<div id="rel" class="section hidden">
  <div class="relbar" id="relBar"></div>
  <div class="reltabs">
    <button class="rtab active" data-rt="deck">🔥 Анкеты</button>
    <button class="rtab" data-rt="matches" id="rtMatches">💞 Мэтчи</button>
  </div>
  <div id="relDeck"></div>
  <div id="relMatches" class="hidden"></div>
</div>

<!-- ПРОФИЛЬ -->
<div id="profile" class="overlay hidden"><div class="overlay-in">
  <button class="back-btn" id="profClose">← Назад</button>
  <div class="profile-top">
    <div class="avatar-wrap">
      <div class="avatar-ring" id="avaRing"></div>
      <div id="avatar" style="width:96px;height:96px;border-radius:26px;overflow:hidden;background:#2a2a3a"></div>
    </div>
    <div>
      <div class="p-name" id="pName">Ты</div>
      <span class="p-tier" id="pTier"></span>
      <div class="p-tier-sub" id="pTierSub"></div>
    </div>
  </div>
  <div class="stats-list">
    <div class="srow"><span class="sl">💰 Деньги</span><span class="sv money" id="sMoney">0</span></div>
    <div class="srow"><span class="sl">🔥 Лукс</span><span class="sv looks" id="sLooks">3.0</span><div class="bar"><div id="bLooks" style="width:30%;background:#ff5c8a"></div></div></div>
    <div class="srow"><span class="sl">🧠 IQ</span><span class="sv iq" id="sIq">70</span><div class="bar"><div id="bIq" style="width:70%;background:#6bd6ff"></div></div></div>
    <div class="srow"><span class="sl">👑 Статус</span><span class="sv status" id="sStatus">0</span><div class="bar"><div id="bStatus" style="background:#a06bff"></div></div></div>
    <div class="srow"><span class="sl">✨ Аура</span><span class="sv aura" id="sAura">0</span><div class="bar"><div id="bAura" style="background:#7dffa8"></div></div></div>
    <div class="srow"><span class="sl">⚡ Энергия</span><span class="sv" id="sEnergy" style="color:#7dffa8">100</span><div class="bar"><div id="bEnergy" style="background:#7dffa8"></div></div></div>
  </div>
  <div class="daily">
    <div class="d-title">🎁 Ежедневный подарок</div>
    <div class="d-desc" id="dailyDesc"></div>
    <button class="btn-big" id="dailyBtn">Забрать</button>
  </div>
  <button class="btn-ghost" id="resetBtn" style="margin-top:16px;color:#ff7b7b">Сбросить прогресс</button>
</div></div>

<nav class="bottomnav">
  <button class="navitem active" data-tab="train"><span class="ic">🏋️</span>Качалка</button>
  <button class="navitem" data-tab="biz"><span class="ic">💼</span>Заработок</button>
  <button class="navitem" data-tab="battle"><span class="ic">⚔️</span>Mog</button>
  <button class="navitem" data-tab="estate"><span class="ic">🏠</span>Недвижка</button>
  <button class="navitem" data-tab="rel"><span class="ic">❤️</span>Отношения</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0d0d12'); }
const tgUser = tg?.initDataUnsafe?.user;
const playerName = tgUser?.username || tgUser?.first_name || 'Ты';
const pick = a => a[Math.floor(Math.random()*a.length)];

// ---------- Состояние ----------
const DEFAULTS = { money:500, looks:3.0, iq:70, status:0, aura:0, energy:100,
  biz:[], estate:[], rel:null, streak:0, lastDaily:null, lastSleep:0, opps:null, oppsTime:0,
  girls:null, matches:[] };
let S = load();
function load(){
  let d;
  try { d = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('moglife'))); }
  catch(e){ d = {...DEFAULTS}; }
  // чиним битые числа (например NaN, попавший в сохранение)
  ['money','looks','iq','status','aura','energy'].forEach(k => { if (!Number.isFinite(d[k])) d[k] = DEFAULTS[k]; });
  if (!Array.isArray(d.matches)) d.matches = [];
  d.biz = d.biz || []; d.estate = d.estate || [];
  return d;
}
function save(){ localStorage.setItem('moglife', JSON.stringify(S)); }

// ---------- Тиры ----------
const TIERS = [
  {max:2,   n:'Саб-1',    e:'🤢', c:'#8aff5c', bg:'#26331a', d:'Саб-1. Жёсткий случай. Но выход есть всегда.'},
  {max:3,   n:'Саб-2',    e:'😖', c:'#c6ff5c', bg:'#2b331a', d:'Саб-2. Глубоко, но уже не безнадёжно.'},
  {max:4,   n:'Саб-3',    e:'😭', c:'#ff5c5c', bg:'#3a1a1a', d:'Саб-3. Ниже базы. Надо работать. Жёстко.'},
  {max:5,   n:'Саб-4',    e:'🙁', c:'#ff9a5c', bg:'#3a2a1a', d:'Саб-4. Почти норм, ещё чуть-чуть.'},
  {max:5.5, n:'Саб-5',    e:'😕', c:'#ffbf5c', bg:'#3a2f1a', d:'Саб-5. Край сабов. Скоро выберешься.'},
  {max:6,   n:'LTN',      e:'😐', c:'#ffd166', bg:'#3a3a1a', d:'Low-Tier Normie. Уже не саб, но пахнет.'},
  {max:6.5, n:'MTN',      e:'🙂', c:'#e0e05c', bg:'#33301a', d:'Mid-Tier Normie. В толпе не выделяешься.'},
  {max:7,   n:'HTN',      e:'😊', c:'#a8e05c', bg:'#22301a', d:'High-Tier Normie. Девчонки начинают смотреть.'},
  {max:7.5, n:'HTN+',     e:'😌', c:'#6ee05c', bg:'#1a301c', d:'HTN+. Верх нормисов. Почти элита.'},
  {max:8,   n:'Чад Лайт', e:'😎', c:'#5cd6a0', bg:'#1a3028', d:'Chadlite. Можешь почти всех. Почти.'},
  {max:8.5, n:'Чад',      e:'😈', c:'#5cb8ff', bg:'#1a2838', d:'Чад. Люди оборачиваются.'},
  {max:9,   n:'Чад+',     e:'🔥', c:'#b06bff', bg:'#251a38', d:'Чад+. Выше только миф.'},
  {max:99,  n:'Тру Адам', e:'🗿', c:'#c89aff', bg:'#2a1a3a', d:'True Adam. Первый человек. Идеал.'},
];
function getTier(l){
  for (let i=0; i<TIERS.length; i++)
    if (l < TIERS[i].max) return Object.assign({idx:i}, TIERS[i]);
  return Object.assign({idx:TIERS.length-1}, TIERS[TIERS.length-1]);
}

// ---------- Данные ----------
const TRAIN = [
  { id:'gym',   icon:'🏋️', name:'Зал', desc:'Железо, подходы и дисциплина. Тело — первое, что замечают люди, поэтому зал не пропускают.',
    eff:'🔥 +0.2 лукс · 👑 +1 статус', cost:100, energy:20, fx:s=>{s.looks+=0.2; s.status+=1;} },
  { id:'face',  icon:'🧴', name:'Уход за лицом', desc:'Умывание, крем и санскрин каждый день. Чистая кожа — основа любого образа.',
    eff:'🔥 +0.15 лукс', cost:150, energy:10, fx:s=>{s.looks+=0.15;} },
  { id:'hair',  icon:'💇', name:'Причёска', desc:'Поход к хорошему барберу: фейд, текстура и укладка, которая держится весь день.',
    eff:'🔥 +0.3 лукс', cost:300, energy:5, fx:s=>{s.looks+=0.3;} },
  { id:'style', icon:'👕', name:'Одежда', desc:'Вещи, которые хорошо сидят и собираются в единый образ. Важен вайб, а не ценник.',
    eff:'🔥 +0.4 лукс', cost:800, energy:5, fx:s=>{s.looks+=0.4;} },
  { id:'books', icon:'📚', name:'Читать', desc:'Книги по переговорам, психологии и биохакингу. Недорого, а голова работает лучше.',
    eff:'🧠 +3 IQ', cost:50, energy:15, fx:s=>{s.iq+=3;} },
  { id:'course',icon:'🎓', name:'Курсы', desc:'Платное обучение с наставником и полезными знакомствами. Дорого, зато открывает двери.',
    eff:'🧠 +8 IQ · 👑 +2 статуса', cost:1000, energy:25, fx:s=>{s.iq+=8; s.status+=2;} },
  { id:'jaw',   icon:'🏥', name:'Операция (эстет.)', desc:'Ментопластика или ринопластика. Тяжёлое восстановление, но результат заметен сразу.',
    eff:'🔥 +1.0 лукс · 👑 +3 · ✨ −5 ауры', cost:10000, energy:60, fx:s=>{s.looks+=1.0; s.status+=3; s.aura-=5;} },
  { id:'sleep', icon:'😴', name:'Восстановиться', desc:'Нормальный здоровый сон. Без него остальные занятия просто не потянуть. Куллдаун 2 минуты.',
    eff:'⚡ +60 энергии · ⏳ куллдаун 2 мин', cost:0, energy:-60, fx:s=>'😴 Выспался: +60 энергии' },
];
const BIZ = [

function costText(item, isBiz){
  const parts = [];
  if (item.cost) parts.push(`💰 ${fmt(item.cost)}`);
  const e = item.energy || 0;
  if (e > 0) parts.push(`⚡${e}`);
  if (e < 0) parts.push(`⚡ +${-e}`);
  return parts.join(' | ') || 'Бесплатно';
}
function renderCards(list, containerId, ownedIds, isBiz){
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  list.forEach(item => {
    const owned = ownedIds?.includes(item.id);
    const div = document.createElement('div');
    div.className = 'card' + (owned ? ' locked' : '');
    div.dataset.id = item.id;
    const eff = isBiz ? `💰 +${fmt(item.income)}₽ за тик · 👑 +2 статуса` : (item.eff || '');
    div.innerHTML = `<div class="icon">${item.icon}</div><div class="name">${item.name}</div>`
      + `<div class="desc">${item.desc || ''}</div>`
      + (eff ? `<div class="eff">${eff}</div>` : '')
      + `<div class="cost">${owned ? '✅ Куплено' : costText(item, isBiz)}</div>`;
    if (!owned) div.onclick = () => doAction(item, isBiz);
    c.appendChild(div);
  });
}
function renderLists(){
  renderCards(TRAIN, 'trainGrid');
  renderCards(BIZ, 'bizGrid', S.biz, true);
  renderCards(GRIND, 'grindGrid');
  renderCards(ESTATE, 'estateGrid', S.estate);
}

const SLEEP_CD = 120000; // 2 минуты куллдаун на сон
function sleepLeft(){ return Math.max(0, SLEEP_CD - (Date.now() - S.lastSleep)); }
function doAction(item, isBiz){
  if (item.req && !item.req(S)) { toast('❌ Нужен лукс 6+ для этого'); return; }
  if (item.id === 'sleep') {
    const rem = sleepLeft();
    if (rem > 0) { toast(`😴 Ещё не хочется спать. Куллдаун: ${Math.ceil(rem/1000)}с`); return; }
    if (S.energy >= 100) { toast('⚡ Ты и так полон сил'); return; }
    S.lastSleep = Date.now();
  }
  const need = Math.max(0, item.energy || 0);
  const restore = Math.max(0, -(item.energy || 0));
  if (S.energy < need) { toast('😮‍💨 Нет энергии. Поспи.'); return; }
  if (S.money < item.cost) { toast('💸 Не хватает денег'); return; }
  S.money -= item.cost;
  S.energy = Math.min(100, S.energy - need + restore);
  let msg = '';
  if (isBiz) { S.biz.push(item.id); S.status += 2; msg = `✅ Открыл: ${item.name}`; }
  else if (item.fx) {
    msg = item.fx(S) || `${item.icon} ${item.name}: сделано`;
    if (ESTATE.some(e => e.id === item.id)) S.estate.push(item.id);
  }
  if (msg) toast(msg);
  renderStats(); renderLists(); save();
}

const OPP_NAMES = ['Gymcel_Гоша','JawlineKing','Chadlite_Дима','Саня_Масса','HTN_Mакс','Квадрочел','Скуллмаксер','Низкий_Стартер','Брейнрот2007','Лукс_Пётр','Мог_Антон','Хейрсистемщик','Фейсинжектор','Мидфейс_Вован'];
const OPP_EMOJI = ['🗿','😐','😤','💪','🧢','😬','🤨','🏋️','🍔','😴','🤡','🦍'];
function genOpps(){
  const arr = [];
  const used = new Set();
  for (let i=0;i<3;i++){
    let ni = Math.floor(Math.random()*OPP_NAMES.length);
    while(used.has(ni)) ni = Math.floor(Math.random()*OPP_NAMES.length);
    used.add(ni);
    const looks = +(Math.max(2, Math.min(9.8, S.looks + (Math.random()*3 - 1.4)))).toFixed(1);
    arr.push({ name: OPP_NAMES[ni], e: OPP_EMOJI[Math.floor(Math.random()*OPP_EMOJI.length)],
      looks, status: Math.round(looks*4 + Math.random()*30), aura: Math.round(looks*8 + Math.random()*40) });
  }
  S.opps = arr; S.oppsTime = Date.now();
}
function ensureOpps(){ if (!S.opps || Date.now() - S.oppsTime > 5*60*1000) genOpps(); }
function renderBattle(){
  ensureOpps();
  const c = document.getElementById('oppList');
  c.innerHTML = '';
  S.opps.forEach((o,i) => {
    const t = getTier(o.looks);
    const div = document.createElement('div');
    div.className = 'opp';
    div.innerHTML = `
      <div class="opp-head">
        <div class="opp-ava">${o.e}</div>
        <div><div class="opp-name">${o.name}</div><div class="opp-tier">${t.e} ${t.n}</div></div>
      </div>
      <div class="opp-stats"><span class="looks">🔥 ${o.looks.toFixed(1)}</span><span class="status">👑 ${o.status}</span><span class="aura">✨ ${o.aura}</span></div>
      <button class="btn-battle">⚔️ MOG'нуть (⚡20)</button>`;
    div.querySelector('.btn-battle').onclick = () => battle(i);
    c.appendChild(div);
  });
  const left = Math.max(0, 5*60*1000 - (Date.now() - S.oppsTime));
  document.getElementById('timerNote').textContent =
    `Обновление соперников через ${Math.ceil(left/60000)} мин`;
}
function power(l, st, au, iq){ return l*10 + st*0.8 + au*0.5 + iq*0.2 + Math.random()*18; }
function battle(i){
  if (S.energy < 20) { toast('😮‍💨 Мало энергии для батла'); return; }
  S.energy -= 20;
  const o = S.opps[i];
  const my = power(S.looks, S.status, S.aura, S.iq);
  const their = power(o.looks, o.status, o.aura, 80);
  if (my >= their) {
    const gainM = Math.round(400 + o.looks*250);
    const gainA = Math.round(10 + o.looks*6);
    S.money += gainM; S.aura += gainA; S.looks += 0.05; S.status += 2;
    toast(`😈 Замогал ${o.name}! +${fmt(gainM)}₽, +${gainA} ауры`);
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } else {
    S.aura = Math.max(0, S.aura - 8);
    toast(`💀 ${o.name} замогал ТЕБЯ... -8 ауры`);
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
  }
  S.opps.splice(i,1);
  save(); renderStats(); renderBattle();
}
document.getElementById('rerollBtn').onclick = () => { genOpps(); save(); renderBattle(); toast('🔄 Новые луксмаксеры'); };

  { t:'😏 Выбирает только Чадов',   m:1.2,  bio:'Низкий лукс даже не рассматриваю. Простите.' },
  { t:'🎓 Студентка',               m:1.0,  bio:'Учусь, гуляю по городу и иногда пишу первой.' },
  { t:'💼 Карьеристка',             m:1.1,  bio:'Времени мало. Нужен тот, кто не отстаёт и умеет поддержать.' },
  { t:'🌙 Просто общается',         m:0.95, bio:'Давай сначала познакомимся, а там посмотрим.' },
  { t:'🏋️ Фитоняшка',               m:1.05, bio:'Тренировки по утрам, кофе по вечерам. Ищу напарника для зала.' },
];
const G_REJECT = ['Прости... ты слишком саб','Не мой тип, извини','Мы не совпали','Ты пока не дотягиваешь','Поищи кого-нибудь попроще'];
const G_SKIN = ['#f6d5bd','#eac09a','#d9a67a','#c28b61'];
const G_HAIR = ['#1a1210','#4a2c1a','#8a5a2b','#c9a24a','#b0402a','#2a2a3a'];
const G_BG   = ['#3a1f3a','#1f2f4a','#2f3a24','#4a2a2a','#1f3a3a','#3a2f4a'];
const G_TOP  = ['#ff5c8a','#6bd6ff','#a06bff','#ffd166','#2a2a3a','#7dffa8'];
const G_EYES = ['#3a2a1a','#2a5a8a','#3a6a3a','#5a3a2a'];
const G_LIPS = ['#d9667a','#c0485e','#e08a8a','#a8384e'];

function genTraits(){
  return { skin:pick(G_SKIN), hair:pick(G_HAIR), hstyle:Math.floor(Math.random()*3), bg:pick(G_BG),
           top:pick(G_TOP), eyes:pick(G_EYES), lips:pick(G_LIPS) };
}
function genGirl(){
  const st = pick(G_STATUSES);
  return Object.assign({ id:Math.random().toString(36).slice(2), name:pick(G_NAMES), age:20+Math.floor(Math.random()*9),
    looks:+(2 + Math.random()*7).toFixed(1), status:st.t, mod:st.m, bio:st.bio }, genTraits());
}
function ensureGirl(g){
  if (g.skin === undefined) Object.assign(g, genTraits());
  if (!g.age) g.age = 22;
  if (!g.status) g.status = '💞 В отношениях';
  return g;
}
// Визуализация девушки (SVG): причёска, цвет кожи, глаза и губы зависят от анкеты
function girlSVG(g){
  ensureGirl(g);
  const back = g.hstyle===0
    ? `<path d="M24 62 Q20 18 60 16 Q100 18 96 62 L102 132 Q60 142 18 132 Z" fill="${g.hair}"/>`
    : g.hstyle===1
    ? `<path d="M26 60 Q26 20 60 18 Q94 20 94 60 L92 96 Q60 106 28 96 Z" fill="${g.hair}"/>`
    : `<circle cx="60" cy="16" r="12" fill="${g.hair}"/><path d="M30 58 Q30 22 60 20 Q90 22 90 58 Z" fill="${g.hair}"/>`;
  return `<svg viewBox="0 0 120 130" width="100%" height="100%" preserveAspectRatio="xMidYMin slice">
    <rect width="120" height="130" fill="${g.bg}"/>
    ${back}
    <path d="M14 150 Q20 110 60 106 Q100 110 106 150 Z" fill="${g.top}"/>
    <rect x="52" y="84" width="16" height="26" fill="${g.skin}"/>
    <path d="M52 100 Q60 108 68 100 L68 108 Q60 114 52 108 Z" fill="#00000022"/>
    <ellipse cx="60" cy="64" rx="26" ry="30" fill="${g.skin}"/>
    <path d="M33 58 Q38 30 60 30 Q82 30 87 58 Q76 42 60 44 Q44 42 33 58 Z" fill="${g.hair}"/>
    <ellipse cx="49" cy="66" rx="5" ry="3.2" fill="#fff"/><ellipse cx="71" cy="66" rx="5" ry="3.2" fill="#fff"/>
    <circle cx="49" cy="66" r="2.5" fill="${g.eyes}"/><circle cx="71" cy="66" r="2.5" fill="${g.eyes}"/>
    <circle cx="49" cy="66" r="1.1" fill="#111"/><circle cx="71" cy="66" r="1.1" fill="#111"/>
    <path d="M43 63 Q49 59 55 63 M65 63 Q71 59 77 63" stroke="#111" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M44 57 Q49 54 54 57 M66 57 Q71 54 76 57" stroke="${g.hair}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M60 70 Q58 76 61 77" stroke="#00000033" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M52 83 Q60 89 68 83 Q60 81 52 83 Z" fill="${g.lips}"/>
    <circle cx="43" cy="76" r="5" fill="#ff7a9a" opacity=".22"/><circle cx="77" cy="76" r="5" fill="#ff7a9a" opacity=".22"/>
  </svg>`;
}

let relTab = 'deck', swiping = false;

function renderRel(){
  // верхняя плашка: с кем встречаешься
  const bar = document.getElementById('relBar');
  if (S.rel) {
    ensureGirl(S.rel);
    bar.innerHTML = `<div class="rb-ava">${girlSVG(S.rel)}</div>
      <div class="rb-txt"><div class="rb-t">💞 В отношениях</div><div class="rb-n">${S.rel.name}, ${S.rel.age}</div>
      <div class="rb-s">🔥 ${(+S.rel.looks).toFixed(1)} лукс</div></div>
      <button class="rb-btn" id="breakBtn">💔 Расстаться</button>`;
    document.getElementById('breakBtn').onclick = breakUp;
  } else {
    bar.innerHTML = `<div class="rb-txt"><div class="rb-t">Статус</div><div class="rb-n">Свободен</div>
      <div class="rb-s">Свайпай анкеты и ищи пару</div></div>`;
  }
  document.getElementById('rtMatches').textContent = `💞 Мэтчи${S.matches.length ? ' (' + S.matches.length + ')' : ''}`;
  document.querySelectorAll('.rtab').forEach(b => b.classList.toggle('active', b.dataset.rt === relTab));
  document.getElementById('relDeck').classList.toggle('hidden', relTab !== 'deck');
  document.getElementById('relMatches').classList.toggle('hidden', relTab !== 'matches');
  if (relTab === 'deck') renderDeck(); else renderMatches();
}
document.querySelectorAll('.rtab').forEach(b => b.onclick = () => { relTab = b.dataset.rt; renderRel(); });

function gcard(g, cls){
  const top = cls === 'top';
  return `<div class="gcard ${cls}" ${top ? 'id="topCard"' : ''}>
    <div class="gpic">${girlSVG(g)}</div>
    ${top ? '<div class="stamp like">LIKE</div><div class="stamp nope">NOPE</div>' : ''}
    <div class="ginfo">
      <div class="gname">${g.name}, ${g.age}</div>
      <div class="gchips"><span class="chip st">${g.status}</span><span class="chip lk">🔥 ${(+g.looks).toFixed(1)}</span></div>
      <div class="gbio">${g.bio || ''}</div>
    </div></div>`;
}
function renderDeck(){
  if (!Array.isArray(S.girls)) S.girls = [];
  while (S.girls.length < 4) S.girls.push(genGirl());
  const el = document.getElementById('relDeck');
  el.innerHTML = `<div class="swipe-area">${gcard(S.girls[1], 'behind')}${gcard(S.girls[0], 'top')}</div>
    <div class="swipe-btns">
      <button class="rbtn nope" id="btnNope">✖</button>
      <button class="rbtn like" id="btnLike">❤️</button>
    </div>
    <div class="swipe-hint">Свайп вправо или ❤️ — лайк (⚡10). Свайп влево или ✖ — пропустить.</div>`;
  document.getElementById('btnNope').onclick = () => swipe(false);
  document.getElementById('btnLike').onclick = () => swipe(true);
  attachSwipe(document.getElementById('topCard'));
  save();
}
function resetCard(card){
  card.style.transition = 'transform .2s';
  card.style.transform = '';
  card.querySelectorAll('.stamp').forEach(x => x.style.opacity = 0);
}
function attachSwipe(card){
  let sx = 0, dx = 0, drag = false;
  const like = card.querySelector('.stamp.like'), nope = card.querySelector('.stamp.nope');
  card.addEventListener('pointerdown', e => { if (swiping) return; drag = true; sx = e.clientX; dx = 0;
    card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
  card.addEventListener('pointermove', e => {
    if (!drag) return;
    dx = e.clientX - sx;
    card.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    like.style.opacity = Math.max(0, Math.min(1, dx/90));
    nope.style.opacity = Math.max(0, Math.min(1, -dx/90));
  });
  const end = () => {
    if (!drag) return; drag = false;
    if (dx > 90) swipe(true); else if (dx < -90) swipe(false); else resetCard(card);
    dx = 0;
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}
function swipe(isLike){
  const card = document.getElementById('topCard');
  if (!card || swiping) return;
  if (isLike && S.energy < 10) { toast('😮‍💨 Нет энергии на лайк. Поспи.'); resetCard(card); return; }
  swiping = true;
  card.style.transition = 'transform .25s, opacity .25s';
  card.style.transform = `translateX(${isLike ? 500 : -500}px) rotate(${isLike ? 25 : -25}deg)`;
  card.style.opacity = 0;
  setTimeout(() => resolveSwipe(isLike), 240);
}
function resolveSwipe(isLike){
  const g = S.girls.shift();
  if (isLike) {
    S.energy = Math.max(0, S.energy - 10);
    const mine = S.looks*1.5 + S.status*0.2 + S.iq*0.05 + S.aura*0.1 + (Math.random()*3 - 1.5);
    const bar = g.looks * 1.8 * (g.mod || 1);
    if (mine >= bar) {
      S.matches.push(g); S.aura += 2;
      toast(`💞 Мэтч с ${g.name}! Она на ${(+g.looks).toFixed(1)} лукс. +2 ауры`);
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    } else {
      toast(`💔 ${g.name}: «${pick(G_REJECT)}»`);
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }
  }
  swiping = false;
  save(); renderStats(); renderRel();
}
function renderMatches(){
  const el = document.getElementById('relMatches');
  if (!S.matches.length) {
    el.innerHTML = `<div class="empty-note">Пока нет мэтчей.<br>Лайкай анкеты — если ты ей понравишься, она появится здесь.</div>`;
    return;
  }
  el.innerHTML = '';
  S.matches.forEach(g => {
    const div = document.createElement('div');
    div.className = 'match';
    div.innerHTML = `<div class="m-ava">${girlSVG(g)}</div>
      <div class="m-body"><div class="m-name">${g.name}, ${g.age}</div>
        <div class="gchips"><span class="chip st">${g.status}</span><span class="chip lk">🔥 ${(+g.looks).toFixed(1)}</span></div>
        <div class="m-btns"><button class="m-go">💘 Встречаться</button><button class="m-del">✖</button></div></div>`;
    div.querySelector('.m-go').onclick = () => startDating(g);
    div.querySelector('.m-del').onclick = () => { S.matches = S.matches.filter(x => x.id !== g.id); save(); renderRel(); };
    el.appendChild(div);
  });
}
function startDating(g){
  if (S.rel) { toast(`Сначала расстанься с ${S.rel.name}`); return; }
  S.rel = g; S.matches = S.matches.filter(x => x.id !== g.id); S.aura += 5;
  toast(`💘 Теперь вы с ${g.name}! +5 ауры`);
  save(); renderStats(); renderRel();
}
function breakUp(){
  if (!S.rel || !confirm(`Расстаться с ${S.rel.name}?`)) return;
  S.rel = null; S.aura = Math.max(0, S.aura - 3);
  toast('💔 Вы расстались. −3 ауры');
  save(); renderStats(); renderRel();
}

// ---------- Ежедневный подарок ----------
function todayStr(){ return new Date().toDateString(); }
function renderDaily(){
  const btn = document.getElementById('dailyBtn');
  const desc = document.getElementById('dailyDesc');
  if (S.lastDaily === todayStr()) {
    btn.disabled = true; btn.style.opacity = .4; btn.textContent = 'Забрано ✓';
    desc.textContent = `Серия: ${S.streak} дн. Приходи завтра.`;
  } else {
    btn.disabled = false; btn.style.opacity = 1;
    btn.textContent = `Забрать подарок (серия ${S.streak} → ${S.streak+1})`;
    desc.textContent = `Награда: ${fmt((S.streak+1)*500)}₽ + ${(S.streak+1)*5} ауры. Заходи каждый день — серия растёт.`;
  }
}
document.getElementById('dailyBtn').onclick = () => {
  if (S.lastDaily === todayStr()) return;
  S.streak = (S.lastDaily === new Date(Date.now()-864e5).toDateString()) ? S.streak+1 : 1;
  S.lastDaily = todayStr();
  const gainM = S.streak*500, gainA = S.streak*5;
  S.money += gainM; S.aura += gainA; S.energy = 100;
  toast(`🎁 День ${S.streak}: +${fmt(gainM)}₽, +${gainA} ауры, энергия на максимум!`);
  renderStats(); save();
};
document.getElementById('resetBtn').onclick = () => {
  if (confirm('Точно сбросить весь прогресс?')) { localStorage.removeItem('moglife'); location.reload(); }
};

// обновление куллдауна сна на карточке
setInterval(() => {
  const card = document.querySelector('#trainGrid .card[data-id="sleep"]');
  if (!card) return;
  const rem = sleepLeft();
  const costEl = card.querySelector('.cost');
  if (rem > 0) { card.classList.add('locked'); costEl.textContent = `⏳ Куллдаун ${Math.ceil(rem/1000)}с`; }
  else { card.classList.remove('locked'); costEl.textContent = costText(TRAIN.find(x => x.id === 'sleep')); }
}, 1000);

// ---------- Тики ----------
setInterval(() => {
  S.energy = Math.min(100, S.energy + 3);
  const income = BIZ.filter(b => S.biz.includes(b.id)).reduce((a,b) => a+b.income, 0);
  if (income) S.money += income;
  save(); renderStats();
  if (!document.getElementById('battle').classList.contains('hidden')) renderBattle();
}, 5000);

// ---------- Навигация ----------
document.querySelectorAll('.navitem').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.navitem').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
    const sec = document.getElementById(t.dataset.tab);
    sec.classList.remove('hidden');
    if (t.dataset.tab === 'battle') renderBattle();
    if (t.dataset.tab === 'rel') renderRel();
  };
});
// Профиль открывается по нажатию на аватарку
document.getElementById('tbAva').onclick = () => { renderStats(); document.getElementById('profile').classList.remove('hidden'); };
document.getElementById('profClose').onclick = () => document.getElementById('profile').classList.add('hidden');

function renderAll(){
  renderStats();
  renderLists();
  renderRel();
}
renderAll();
save();
</script>
